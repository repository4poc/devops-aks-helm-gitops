name: Frontend CI and Image Publish

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-ci:
    name: Frontend Tests, Coverage and SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: node-frontend-app/package-lock.json

      - name: Install Dependencies
        working-directory: node-frontend-app
        run: npm ci

      - name: Run Tests and Coverage
        working-directory: node-frontend-app
        run: npm run test

      - name: Build Frontend
        working-directory: node-frontend-app
        run: npm run build

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        timeout-minutes: 5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  helm-validation:
    name: Validate and Package Helm Chart
    needs: frontend-ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set Up Helm
        uses: azure/setup-helm@v4

      - name: Validate Helm Chart
        run: |
          helm lint ./node-frontend-app/helm
          helm template node-frontend-app ./node-frontend-app/helm

      - name: Package Helm Chart
        run: |
          mkdir -p dist
          helm package ./node-frontend-app/helm --destination dist

      - name: Upload Helm Chart Artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-frontend-app-helm-chart
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 14

  publish-image:
    name: Build and Publish Frontend Image
    needs:
      - frontend-ci
      - helm-validation
    runs-on: ubuntu-latest

    # Publish only from main. PRs and non-main manual runs cannot publish.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')

    permissions:
      contents: read

    outputs:
      image: ${{ steps.image-meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Define Image Name
        id: image-meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "image=${DOCKERHUB_USERNAME}/node-frontend-app" >> "$GITHUB_OUTPUT"

      - name: Build and Push Image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./node-frontend-app
          file: ./node-frontend-app/Dockerfile
          push: true
          tags: |
            ${{ steps.image-meta.outputs.image }}:latest
            ${{ steps.image-meta.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: true

      - name: Record Published Image
        env:
          IMAGE: ${{ steps.image-meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "### Frontend image published"
            echo ""
            echo "- Image: \`${IMAGE}:${COMMIT_SHA}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Commit: \`${COMMIT_SHA}\`"
            echo ""
            echo "Use the image digest for promotion across environments."
          } >> "$GITHUB_STEP_SUMMARY"
