name: Deployment Pipeline
on: push
#on: workflow_dispatch
jobs:
  Test-Job:
    runs-on: ubuntu-latest
    steps:
      #      - name: Get Code
      #        run: |
      #          git clone https://github.com/repository4poc/devops-aks-helm-gitops Readme.md
      #          ls
      - name: Get Code
        uses: actions/checkout@v7
      - name: Check Code
        run: ls

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check node version
        run: node --version

      - name: Cache Dependencies
        id: cache-deps
        uses: threeal/cache-action@v1.0.0
        with:
          key: node-deps
          version: ${{ hashFiles('package-lock.json') }}
          files: node_modules

      - name: Install Dependencies
        if: steps.cache-deps.outputs.restored == 'false'
        run: |
          cd node-backend-app
          npm install

      - name: Run Tests
        run: |
          cd node-backend-app
          npm test
  Build-Job:
    needs: [Test-Job]
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v7
      - name: Check Code
        run: ls
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check node version
        run: node --version
      - name: Install dependencies
        run: |
          cd node-backend-app
          npm ci
      - name: Build Project
        run: |
          cd node-backend-app
          npm run build
