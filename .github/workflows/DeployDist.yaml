name: Deployment Pipeline

on:
  push:
  workflow_dispatch:

jobs:
  Test-Job:
    runs-on: ubuntu-latest

    steps:
      - name: Get Code
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: node-backend-app/package-lock.json

      - name: Check Node Version
        run: node --version

      - name: Install Dependencies
        working-directory: node-backend-app
        run: npm ci

      - name: Run Tests
        working-directory: node-backend-app
        run: npm test

  Build-Job:
    needs: Test-Job
    runs-on: ubuntu-latest

    steps:
      - name: Get Code
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: node-backend-app/package-lock.json

      - name: Check Node Version
        run: node --version

      - name: Install Dependencies
        working-directory: node-backend-app
        run: npm ci

      - name: Build Project
        working-directory: node-backend-app
        run: npm run build
