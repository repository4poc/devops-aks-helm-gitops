name: Deployment Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'features/**'
    paths-ignore:
      - Readme.md

permissions:
  contents: read

jobs:
  Test-Job:
    runs-on: ubuntu-latest

    steps:
      - name: Get Code
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: node-backend-app/package-lock.json

      - name: Install Dependencies
        working-directory: node-backend-app
        run: npm ci

      - name: Run Tests
        working-directory: node-backend-app
        run: npm test

  Build-Job:
    needs: Test-Job
    runs-on: ubuntu-latest

    steps:
      - name: Get Code
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: node-backend-app/package-lock.json

      - name: Install Dependencies
        working-directory: node-backend-app
        run: npm ci

      - name: Build Project
        working-directory: node-backend-app
        run: npm run build

  Docker-Build-and-Push:
    needs: Build-Job
    runs-on: ubuntu-latest

    steps:
      - name: Get Code
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./node-backend-app
          file: ./node-backend-app/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/node-backend-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/node-backend-app:${{ github.sha }}
