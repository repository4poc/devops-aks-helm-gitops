name: Deployment Pipeline
#on: push
on: workflow_dispatch
jobs:
  Test-Job:
    runs-on: ubuntu-latest
    steps:
      #      - name: Get Code
      #        run: |
      #          git clone https://github.com/repository4poc/devops-aks-helm-gitops Readme.md
      #          ls
      - name: Get Code
        uses: actions/checkout@v7
      - name: Check Code
        run: ls
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check node version
        run: node --version
      - name: Install dependencies
        run: |
          cd node-backend-app
          npm ci
      - name: Run Tests
        run: |
          cd node-backend-app
          npm test
