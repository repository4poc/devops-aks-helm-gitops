apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Values.name}}
  namespace: {{.Values.namespace}}
  labels:
    app: {{.Values.podLabels.name}}

spec:
  replicas: {{.Values.replicas}}

  selector:
    matchLabels:
      app: {{.Values.podLabels.name}}

  template:
    metadata:
      labels:
        app: {{.Values.podLabels.name}}

    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: node-backend-app
          image: {{.Values.container.image}}
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: {{.Values.container.port}}
              protocol: TCP

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          envFrom:
            - configMapRef:
                name: node-backend-app-configmap
            - secretRef:
                name: node-backend-app-secret

          env:
            - name: MONGODBURI
              value: 'mongodb://$(MONGO_INITDB_ROOT_USERNAME):$(MONGO_INITDB_ROOT_PASSWORD)@mongodb-service:27017/admin'

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/products
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
