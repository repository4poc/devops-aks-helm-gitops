<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Hello World</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f6f8;
      }

      .container {
        text-align: center;
        background: white;
        padding: 50px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }

      h1 {
        margin-bottom: 15px;
        font-size: 42px;
      }

      p {
        color: #666;
        font-size: 18px;
      }

      .status {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 18px;
        border-radius: 20px;
        background: #e8f5e9;
        color: #2e7d32;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Hello World! 👋</h1>

      <p>Version (4.0)</p>

      <div class="status">Application is running version2</div>
    </div>
  </body>
</html>
