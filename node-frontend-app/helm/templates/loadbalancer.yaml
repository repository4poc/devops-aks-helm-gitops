apiVersion: v1
kind: Service
metadata:
  name: node-frontend-app-service
  namespace: apps
  labels:
    app: node-frontend-app
spec:
  type: LoadBalancer
  selector:
    app: node-frontend-app   # must match the labels in your Deployment's pod template
  ports:
    - name: http
      protocol: TCP
      port: 3000          # port exposed by the load balancer
      targetPort: 3000  # port your Node app listens on in the container