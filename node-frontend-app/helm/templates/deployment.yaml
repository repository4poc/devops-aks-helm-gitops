apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-frontend-app
  namespace: apps
  labels:
    app: node-frontend-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-frontend-app
  template:
    metadata:
      labels:
        app: node-frontend-app
    spec:
      containers:
        - name: node-frontend-app
          #image: '{{ .Values.image.repository }}@{{ .Values.image.digest }}'
          image: 'varindergupta/node-frontend-app@sha256:6fa6d7db36a9aec2f9e20d309308ab40732736eb572db5237b137398a4aff9fc'
          imagePullPolicy: Always
          ports:
            - containerPort: 3000

          livenessProbe:
            httpGet:
              path: /health #/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready #/ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: '100m'
              memory: '128Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'
