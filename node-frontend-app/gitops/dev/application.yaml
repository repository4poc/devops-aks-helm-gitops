apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: node-frontend-app
  namespace: argocd

spec:
  project: dev

  destination:
    server: https://kubernetes.default.svc
    namespace: app

  sources:
    # Helm chart from Azure Container Registry
    - repoURL: oci://acrcompanyplatform.azurecr.io/helm
      chart: node-frontend-app
      targetRevision: 1.0.0
      helm:
        valueFiles:
          - $values/gitops/dev/values.yaml

    # Same Git repository containing the gitops/ directory
    - repoURL: https://github.com/repository4poc/node-frontend-app.git
      targetRevision: main
      ref: values

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true      