apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-backend-app
  namespace: apps
  labels:
    app: node-backend-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-backend-app
  template:
    metadata:
      labels:
        app: node-backend-app
    spec:
      containers:
        - name: node-frontend-app
          image: varinder2284/node-backend-app:2.0
          imagePullPolicy: Always
          ports:
            - containerPort: 3001

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

